# Facet sync server for a host that already runs nginx on 80/443 (see nginx/facet.conf).
# Usage (from this folder): cp ../.env.example .env && edit .env && docker compose up -d --build
name: facet

services:
  facet:
    build: ../../server
    image: facet-sync:latest
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "true"
      PUBLIC_URL: https://${FACET_DOMAIN:-facet.dtsoftware.io}
    # Loopback only: nginx is the public entry point.
    ports:
      - "127.0.0.1:${FACET_PORT:-8788}:8787"
    volumes:
      - facet-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  facet-data:
