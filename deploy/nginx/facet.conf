# Facet behind an existing nginx: website, APK downloads and the sync API.
# Install as /etc/nginx/sites-available/facet, link it into sites-enabled, then run
#   certbot --nginx -d facet.dtsoftware.io --redirect
# which adds the HTTPS listener and the HTTP -> HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name facet.dtsoftware.io;

    root /var/www/facet;
    index index.html;

    # Encrypted attachments are capped at 32 MiB by the server.
    client_max_body_size 40m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    # Sync API (container on loopback). No buffering, so Server-Sent Events stream immediately.
    location /v1/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Exactly one trusted hop: the server reads the client address from here (rate limits).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        gzip off;
    }

    # Release downloads: /var/www/facet-downloads/facet-latest.apk and friends.
    location /download/ {
        alias /var/www/facet-downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition attachment;
        add_header Cache-Control "public, max-age=300";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Static website (web/).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}
