# Facet behind an existing nginx: website, APK downloads and the sync API.
# Install as /etc/nginx/sites-available/facet, link it into sites-enabled, then run
#   certbot --nginx -d facet.dtsoftware.io --redirect
# which adds the HTTPS listener and the HTTP -> HTTPS redirect to this file.
server {
    listen 80;
    listen [::]:80;
    server_name facet.dtsoftware.io;

    root /var/www/facet;
    index index.html;

    # Encrypted attachments are capped at 32 MiB by the server.
    client_max_body_size 40m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    # Sync API (container on loopback). No buffering, so Server-Sent Events stream immediately.
    location /v1/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Exactly one trusted hop: the server reads the client address from here (rate limits).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        gzip off;
    }

    # Release downloads: /var/www/facet-downloads/facet-latest.apk, windows/Facet-Setup.exe and friends.
    location /download/ {
        alias /var/www/facet-downloads/;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition attachment;
        add_header Cache-Control "public, max-age=300";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Windows app updates: electron-updater reads latest.yml, so it must never be served stale.
    location = /download/windows/latest.yml {
        alias /var/www/facet-downloads/windows/latest.yml;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The chat web app (client/, `npm run build`), in /var/www/facet-web/app. It talks to the sync
    # API on this same origin; provider requests go straight from the browser to each provider.
    location = /app {
        return 301 /app/;
    }
    location = /app/manifest.webmanifest {
        root /var/www/facet-web;
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /app/assets/ {
        root /var/www/facet-web;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /app/ {
        root /var/www/facet-web;
        try_files $uri /app/index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; connect-src * data: blob:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Static website (web/).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
}
